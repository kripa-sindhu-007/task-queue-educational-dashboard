name: CI

# Quality gate on every PR to main and every push to main, plus a Docker
# publish that ONLY runs on main and ONLY after both test jobs pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: jobs only need to read the repo. (The publish job
# authenticates to Docker Hub with its own secrets, not GITHUB_TOKEN.)
permissions:
  contents: read

# One in-flight run per ref. Cancel superseded PR runs; never cancel a
# main run mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BACKEND_IMAGE: kripa007/taskqueue-backend
  FRONTEND_IMAGE: kripa007/taskqueue-frontend

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: gofmt (fail if unformatted)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test ./... -race -count=1

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        run: npm run build

  publish:
    name: publish
    # Publish only after the gate is green, only for pushes to main.
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Extract short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Build and push backend image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:latest -t ${{ env.BACKEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }} ./backend
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
      - name: Build and push frontend image
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:latest -t ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }} ./frontend
          docker push ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
