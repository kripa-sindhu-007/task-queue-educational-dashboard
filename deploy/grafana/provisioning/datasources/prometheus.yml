# Auto-provisioned Prometheus datasource (P3.3). The fixed uid `prometheus` is
# what the committed dashboard (deploy/grafana/dashboards/taskqueue.json)
# references, so the dashboard wires up on first boot with no manual step.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
