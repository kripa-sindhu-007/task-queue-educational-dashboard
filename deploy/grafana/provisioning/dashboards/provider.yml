# Dashboard file provider (P3.3). Grafana loads every dashboard JSON under the
# mounted path on boot, so deploy/grafana/dashboards/taskqueue.json is the one
# committed, version-controlled dashboard — no manual import.
apiVersion: 1

providers:
  - name: taskqueue
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
