# Prometheus scrape config for the task-queue platform (P3.3, updated P4.3).
#
# Three application jobs plus a self-scrape:
#   * taskqueue-server    — the API node (compose service `backend`). Single,
#     stable target. Owns queue_depth (scrape-time ZCARD, computed by any /server)
#     and tasks_rejected_total (backpressure on submit).
#   * taskqueue-scheduler — the leader-eligible scheduler replicas (P4). The reaper
#     runs only on the elected leader, so reaper_reclaims_total lives here. Scaled
#     with `--scale scheduler=N` and discovered via Docker DNS (like workers), so a
#     killed leader drops out and the new leader's series appears. We KEEP only
#     reaper_reclaims_total from this job — queue_depth is owned by taskqueue-server
#     above, so scraping the same scrape-time gauge here would double-count.
#   * taskqueue-workers   — the standalone worker replicas. Own tasks_processed_total,
#     task_duration_seconds and enqueue_to_start_seconds. Scaled with
#     `docker compose up --scale worker=N`, so they have NO fixed hostname; we
#     discover them via Docker's embedded DNS. An A-record lookup of the service
#     name `worker` returns one record per running replica, so `dns_sd_configs`
#     picks up (and drops) replicas automatically as you scale or kill them —
#     exactly what the kill-a-node demo needs.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: taskqueue-server
    static_configs:
      - targets: ["backend:8080"]
        labels:
          role: server

  - job_name: taskqueue-scheduler
    dns_sd_configs:
      - names: ["scheduler"]
        type: A
        port: 8080
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: role
        replacement: scheduler
    metric_relabel_configs:
      # Only the leader's reaper metric is meaningful here; queue_depth is owned by
      # the taskqueue-server job, so drop everything except reaper_reclaims_total to
      # avoid double-counting the scrape-time gauges every /server also exposes.
      - source_labels: [__name__]
        regex: reaper_reclaims_total
        action: keep

  - job_name: taskqueue-workers
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 10s
    relabel_configs:
      # Label each replica by the IP:port DNS returned, so panels can break down
      # per-worker if desired.
      - source_labels: [__address__]
        target_label: instance
      - target_label: role
        replacement: worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
